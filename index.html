<!DOCTYPE html>
<html lang="en">

<head>
  <!-- إعدادات الصفحة الأساسية -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FILMIX — Discover thousands of movies and TV shows, view full details, and build your own personal watchlist." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- عنوان الصفحة (تمت مطابقته مع الاسم التجاري الظاهر فعلياً في الواجهة "FILMIX" بدلاً من "Netflix Clone") -->
  <title>FILMIX — Discover Movies & TV Shows</title>

  <!-- أيقونة الموقع (Favicon) — أيقونة SVG بسيطة بألوان العلامة التجارية -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e50914'/%3E%3Cpath d='M24 18 L46 32 L24 46 Z' fill='white'/%3E%3C/svg%3E" />

  <!-- بطاقات المشاركة على وسائل التواصل الاجتماعي (Open Graph / Twitter) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FILMIX — Discover Movies & TV Shows" />
  <meta property="og:description" content="Search thousands of movies and TV shows, view full details, and build your own personal watchlist." />
  <meta property="og:image" content="/H.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FILMIX — Discover Movies & TV Shows" />
  <meta name="twitter:description" content="Search thousands of movies and TV shows, view full details, and build your own personal watchlist." />
  <meta name="twitter:image" content="/H.png" />

  <!-- تحميل خط Inter بأسلوب لا يعطّل عرض الصفحة (preconnect + font-display: swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
</head>

<body>
  <!-- عنصر الجذر لـ React -->
  <div id="root"></div>

  <!-- تحميل ملف JavaScript الرئيسي -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
